services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mybook
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SOCIAL_PUBLIC_URL=${SOCIAL_PUBLIC_URL:-http://localhost:5000}
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mybook
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mybook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
