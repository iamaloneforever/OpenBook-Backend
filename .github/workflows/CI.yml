name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}

jobs:
  # ============================================================
  # LINT
  # ============================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # ============================================================
  # UNIT TESTS
  # ============================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test -- --coverage

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # E2E TESTS
  # ============================================================

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - unit-tests
      - e2e-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbook-build
          path: dist/
          retention-days: 7

  # ============================================================
  # FINAL CI STATUS
  # ============================================================

  ci:
    name: CI
    runs-on: ubuntu-latest

    if: always()

    needs:
      - lint
      - unit-tests
      - e2e-tests
      - build

    steps:
      - name: Check CI results
        run: |
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "E2E tests:  ${{ needs.e2e-tests.result }}"
          echo "Build:      ${{ needs.build.result }}"

          if [[ \
            "${{ needs.lint.result }}" != "success" ||
            "${{ needs.unit-tests.result }}" != "success" ||
            "${{ needs.e2e-tests.result }}" != "success" ||
            "${{ needs.build.result }}" != "success"
          ]]; then
            echo "❌ CI failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
